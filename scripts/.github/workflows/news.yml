name: update-news
on:
  schedule:
    - cron: "*/10 * * * *"   # ทุก 10 นาที (GitHub อาจช้าได้บ้าง)
  workflow_dispatch:          # กดรันเองได้จากแท็บ Actions
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      - name: commit news.json ถ้ามีข่าวเปลี่ยน
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "update news" && git push)
